name: release

# Cuts a release whenever a tag matching v* is pushed.  Example:
#
#   git tag -a v1.0.0a1 -m "Release 1.0.0a1"
#   git push origin v1.0.0a1
#
# Tag version MUST match the `version` field in pyproject.toml.  The
# workflow builds the wheel + sdist, runs `twine check`, uploads to
# TestPyPI for staging, then to real PyPI.
#
# Setup (one-time, before the first tagged release):
#
#   1. PyPI (https://pypi.org/manage/account/publishing/) —
#      add a "pending publisher" with:
#        Owner: deeplethe
#        Repository: lethe
#        Workflow filename: release.yml
#        Environment name: pypi
#
#   2. TestPyPI (https://test.pypi.org/manage/account/publishing/) —
#      same fields, environment name: testpypi
#
#   3. GitHub repo Settings → Environments → create `pypi` and
#      `testpypi` environments (no protection rules required, but you
#      can require manual approval for `pypi` if you want a gate).
#
# Trusted publishing means: no API tokens, no secrets, OIDC handles
# auth between GitHub and PyPI automatically.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel + sdist
        run: python -m build

      - name: Verify metadata + README rendering
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pylethe
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    name: Publish to PyPI
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pylethe
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
