name: release

# Cuts a release whenever a tag matching v* is pushed.  Example:
#
#   git tag -a v1.0.0a1 -m "Release 1.0.0a1"
#   git push origin v1.0.0a1
#
# Tag version MUST match the `version` field in pyproject.toml.  The
# workflow builds the wheel + sdist, runs `twine check`, then publishes
# straight to PyPI.
#
# Setup (one-time, before the first tagged release):
#
#   1. PyPI (https://pypi.org/manage/account/publishing/) —
#      add a "pending publisher" with:
#        PyPI Project Name:   pylethe
#        Owner:               deeplethe
#        Repository name:     lethe
#        Workflow filename:   release.yml
#        Environment name:    pypi
#
#   2. GitHub repo Settings → Environments → create `pypi`
#      (recommended: add yourself as a required reviewer so the
#      publish step waits for your manual approval — cheap safety
#      gate against accidental releases).
#
# Trusted publishing means: no API tokens, no secrets, OIDC handles
# auth between GitHub and PyPI automatically.  Add a TestPyPI stage
# back later if you want a pre-publish dry run (see git history for
# the two-stage variant).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel + sdist
        run: python -m build

      - name: Verify metadata + README rendering
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pylethe
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
