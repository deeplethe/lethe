<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Lethe logo">
  <title>Lethe</title>
  <!-- Pinned (depth = +∞), small cross above the surface -->
  <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <line x1="100" y1="20" x2="100" y2="34"/>
    <line x1="93"  y1="27" x2="107" y2="27"/>
  </g>
  <!-- Surface line (depth = 1.0) -->
  <line x1="20" y1="75" x2="180" y2="75"
        stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- Inscribed (on surface, filled) -->
  <circle cx="100" cy="75" r="11" fill="currentColor"/>
  <!-- Sinking under gravity -->
  <circle cx="100" cy="118" r="7"
          fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Submerged (depth = 0) -->
  <circle cx="100" cy="155" r="4"
          fill="currentColor" opacity="0.55"/>
  <!-- Purged trace (depth < 0) -->
  <circle cx="100" cy="180" r="1.5"
          fill="currentColor" opacity="0.25"/>
</svg>
